name: Fetch market data (IHSG & Emas)

on:
  schedule:
    # Every hour, offset a few minutes past the hour — GitHub's own docs
    # warn exact-o'clock schedules get delayed/dropped under queue
    # congestion since so many repos schedule at :00.
    - cron: "12 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch market data
        run: python scripts/fetch_market.py

      - name: Commit market data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/market.json; then
            git add data/market.json
            git commit -m "Update market data"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
          else
            echo "No changes to commit"
          fi
