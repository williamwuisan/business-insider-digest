# v2
name: Fetch business news digest

on:
  schedule:
    # ~07:00 and ~16:00 WIB (UTC+7). Offset a few minutes past the hour —
    # GitHub's own docs warn exact-o'clock schedules get delayed/dropped
    # under queue congestion since so many repos schedule at :00.
    - cron: "7 0,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and summarize news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/digest.json; then
            git add data/digest.json
            git commit -m "Update news digest"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
          else
            echo "No changes to commit"
          fi
