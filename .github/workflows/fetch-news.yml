# v2
name: Fetch business news digest

on:
  schedule:
    # 07:00 and 16:00 WIB (UTC+7)
    - cron: "0 0,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and summarize news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Fetch market data (IHSG & Emas)
        run: python scripts/fetch_market.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/digest.json data/market.json; then
            git add data/digest.json data/market.json
            git commit -m "Update news digest and market data"
            git push
          else
            echo "No changes to commit"
          fi
