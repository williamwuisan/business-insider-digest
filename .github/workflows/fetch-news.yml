# v2
name: Fetch business news digest

on:
  schedule:
    # GitHub Actions cron on this repo has proven unreliable at hitting a
    # single exact time (observed: scheduled runs landing hours late or
    # not at all). Instead of one shot at 00:00 and 09:00 UTC (07:00 and
    # 16:00 WIB), fire every 15 min across a 4h window bracketing each
    # target (22:00-02:00 and 07:00-11:00 UTC) so there are many chances
    # to land close to it. fetch_news.py skips the actual work (and its
    # AI cost) if digest.json is already fresh, so the extra attempts
    # are cheap no-ops once one of them lands.
    - cron: "*/15 22,23,0,1,7,8,9,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and summarize news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/digest.json; then
            git add data/digest.json
            git commit -m "Update news digest"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
          else
            echo "No changes to commit"
          fi
